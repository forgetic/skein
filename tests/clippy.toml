# What the test crates under tests/ may not use: they are ordinary Rust
# (programming-model.md, 10.2), but every world is one thread and one loop,
# and a seed replays to the same run (testing-strategy.md, 1).

# Test code may unwrap (testing-strategy.md, 4); the harnesses in each
# crate's src/ say what they expect instead.
allow-unwrap-in-tests = true

disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order depends on a random seed: BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order depends on a random seed: BTreeSet" },
    { path = "std::time::Instant", reason = "the simulator owns time (Sim::now); on the ring, skein_shell::Clock" },
    { path = "std::time::SystemTime", reason = "the simulator owns time (Sim::wall); on the ring, skein_shell::Clock" },
]

disallowed-methods = [
    { path = "std::thread::spawn", reason = "one thread, one loop, so that a run replays" },
]
