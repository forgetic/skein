[package]
name = "skein-echo-world"
description = "The echo's simulated worlds and its real loop: the echo and fake clients as processes, a referee beside them, under tiny limits and every fault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
skein-io.workspace = true
skein-sim.workspace = true
skein-heap.workspace = true
skein-world.workspace = true
skein-echo-service.workspace = true
skein-echo-client.workspace = true

# The clock, for tests/real.rs.
[dev-dependencies]
skein-shell.workspace = true

# Ordinary Rust (programming-model.md, 10.2), so not the step crates' lints.
# tests/clippy.toml bans what would make a run unrepeatable.
[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"          # the harness asserts what it relies on by panicking
wildcard_enum_match_arm = "deny"      # a new variant must break the tests
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
