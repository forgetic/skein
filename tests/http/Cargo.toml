[package]
name = "skein-http-world"
description = "The HTTP client's and the server-sent events reader's machine worlds: transcripts, generated and mutated responses and streams, reference readers, and the two stacked with JSON"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
skein-http.workspace = true
skein-json.workspace = true

[dev-dependencies]
# The counting allocator, for tests/memory.rs only.
skein-heap.workspace = true
# The JSON reference parser, which the stacked test checks each event's
# document against.
skein-json-world = { path = "../json" }

# Ordinary Rust (programming-model.md, 10.2), so not the step crates' lints.
# tests/clippy.toml bans what would make a run unrepeatable.
[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"          # the harness asserts what it relies on by panicking
wildcard_enum_match_arm = "deny"      # a new variant must break the tests
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
