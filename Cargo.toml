# Profiles and lints follow docs/foundation/programming-model.md, 10.1.

[workspace]
resolver = "3"
members = [
    "crates/*",
    "examples/echo/domain",
    "examples/echo/protocol",
    "examples/echo/service",
    "examples/echo/shell",
    "testing/skein-conformance",
    "testing/skein-browser",
    "testing/skein-echo-client",
    "testing/skein-fake-machine",
    "testing/skein-fake-checkout",
    "testing/skein-heap",
    "testing/skein-scratch",
    "testing/skein-world",
    "tests/conformance/ring",
    "tests/conformance/sim",
    "tests/echo",
    "tests/heap",
    "tests/http",
    "tests/io",
    "tests/json",
    "tests/kv",
    "tests/lib",
    "tests/llm",
    "tests/protocol",
    "tests/ring",
    "tests/sim",
    "tests/tls",
    "tests/world",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
skein-lib = { path = "crates/skein-lib" }
skein-io = { path = "crates/skein-io" }
skein-kv = { path = "crates/skein-kv" }
skein-http = { path = "crates/skein-http" }
skein-json = { path = "crates/skein-json" }
skein-llm = { path = "crates/skein-llm" }
skein-tls = { path = "crates/skein-tls" }
skein-shell = { path = "crates/skein-shell" }
skein-sim = { path = "crates/skein-sim" }
skein-conformance = { path = "testing/skein-conformance" }
skein-browser = { path = "testing/skein-browser" }
skein-heap = { path = "testing/skein-heap" }
skein-scratch = { path = "testing/skein-scratch" }
skein-echo-domain = { path = "examples/echo/domain" }
skein-echo-protocol = { path = "examples/echo/protocol" }
skein-echo-service = { path = "examples/echo/service" }
skein-echo-client = { path = "testing/skein-echo-client" }
skein-fake-machine = { path = "testing/skein-fake-machine" }
skein-fake-checkout = { path = "testing/skein-fake-checkout" }
skein-world = { path = "testing/skein-world" }

# The only dependencies from outside the workspace (programming-model.md,
# 2.1): the shell's, for the ring adapter; and rustls, the TLS machine's, the
# one exception of programming-model.md, section 3 (tls.md, 4). rustls is
# pinned and built without std, with ring for its cryptography (0.17.14,
# pinned by Cargo.lock): no default features, which would bring aws-lc-rs.
io-uring = "0.7.15"
libc = "0.2.186"
rustls = { version = "=0.23.41", default-features = false, features = ["ring", "tls12"] }

# Panics are fail-stop and overflow traps, in every profile. (The test harness
# needs unwinding, so cargo ignores `panic` for test targets.)
[profile.dev]
panic = "abort"
overflow-checks = true

[profile.release]
panic = "abort"
overflow-checks = true

# rustls is built as it ships in every dev build, not only the tests': its
# debug assertions hold an alert after close_notify to be a bug, and abort a
# half-closed connection that reads a corrupted record (tls.md, 6). Cargo
# reads profiles only from the root manifest: a workspace that depends on
# skein-tls copies this into its own.
[profile.dev.package.rustls]
debug-assertions = false

# The lints for the step crates (lib and every domain, protocol and io layer).
# Disallowed types, macros and methods are listed in clippy.toml. Ordinary Rust
# (the shell, the crates under tests/) declares its own [lints] table, except
# the simulator (skein-sim), the conformance suite (skein-conformance) and the
# counting allocator (skein-heap): they keep these lints, with a clippy.toml of
# their own that lets in the std types, closures and formatting ordinary Rust
# may use.
[workspace.lints.rust]
unsafe_code = "deny"                  # and forbid at every step crate's root
elided_lifetimes_in_paths = "deny"    # a type that borrows says so: Reader<'_>
unused_must_use = "deny"
non_ascii_idents = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
let_underscore_drop = "deny"          # drop explicitly, or bind a name
missing_debug_implementations = "deny" # state is inspectable in tests and traces
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the model.
module_name_repetitions = "allow"     # http::HttpX reads fine next to io::X
missing_errors_doc = "allow"          # errors are enum values, documented on the enum
missing_panics_doc = "allow"          # panics are assertions, named by expect("...")
needless_pass_by_value = "allow"      # cell handlers take the source state by value
single_match_else = "allow"           # a two-armed match on Option is as clear as if let

# programming-model.md, 10.3.
wildcard_enum_match_arm = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
float_arithmetic = "deny"
unwrap_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
impl_trait_in_params = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

# The rest of what the subset leaves out (programming-model.md, 10.3).
disallowed_methods = "deny"           # closure-taking combinators, panicking slice ops, ...
allow_attributes = "deny"             # #[expect(.., reason = "..")], which fails once it is stale
match_wildcard_for_single_variants = "deny"
enum_glob_use = "deny"                # a variant is named with its enum
wildcard_imports = "deny"
panic = "deny"                        # assert!, unreachable!("why") or expect("invariant")
missing_assert_message = "deny"       # an assertion names what it relies on
assertions_on_result_states = "deny"
unused_result_ok = "deny"
let_underscore_untyped = "deny"
mixed_read_write_in_expression = "deny"  # one side effect per statement
infinite_loop = "deny"
empty_drop = "deny"
exit = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
use_debug = "deny"
host_endian_bytes = "deny"            # byte order is chosen, not inherited from the host
fn_to_numeric_cast_any = "deny"
default_numeric_fallback = "deny"     # every integer has a stated width
std_instead_of_core = "deny"
std_instead_of_alloc = "deny"
alloc_instead_of_core = "deny"
partial_pub_fields = "deny"           # a struct is plain data or opaque, not both
mod_module_files = "deny"
tests_outside_test_module = "deny"
iter_over_hash_type = "deny"
