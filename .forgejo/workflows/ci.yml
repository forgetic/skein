name: ci

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# Builds are cached transparently by the kache daemon (rustc-wrapper in
# ~/.cargo/config.toml on the host runner), so a clean checkout still gets warm
# builds for everything that emits real artifacts (rlibs and test executables).
# skein is self-contained, so no sibling checkout, working-directory trick, or
# local runner data path is needed. The TLS feature set mirrors what downstream
# consumers (temper) enable, so the HTTP client and TLS paths are covered.
jobs:
  validate:
    runs-on: host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build tests
        run: >
          cargo test --workspace
          --features tls,tls-native-roots,tls-webpki-roots --no-run
      - name: Lint
        # clippy runs as a non-blocking signal for now: skein carries a large
        # backlog of pre-existing clippy findings under `-D warnings` (map_or,
        # redundant continue, cast lints, doc-link nits, …). Build + Test are the
        # enforced correctness gates; tightening clippy to deny is a separate
        # cleanup. The `|| true` keeps the surfacing without failing the run.
        run: >
          cargo clippy --workspace --all-targets
          --features tls,tls-native-roots,tls-webpki-roots || true
      - name: Test
        # Most library unit tests run fully parallel. The signal registry tests
        # share process-wide Unix signal handlers, and the real-reactor e2e tests
        # (tests/real_reactor_e2e.rs) share a real reactor/ports, so those suites
        # run single-threaded. `--lib` excludes the integration binary from the
        # first run.
        run: |
          cargo test --workspace --lib \
            --features tls,tls-native-roots,tls-webpki-roots -- --skip signal::registry
          cargo test -p skein --lib \
            --features tls,tls-native-roots,tls-webpki-roots \
            signal::registry -- --test-threads=1
          cargo test --workspace --test real_reactor_e2e \
            --features tls,tls-native-roots,tls-webpki-roots -- --test-threads=1
