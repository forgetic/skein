[package]
name = "skein-echo-shell"
description = "The echo example's main: its configuration, startup, and the loop over the shell kit's kernel and clock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "skein-echo"
path = "src/main.rs"

[dependencies]
skein-lib.workspace = true
skein-io.workspace = true
skein-shell.workspace = true
skein-echo-service.workspace = true

# Ordinary Rust (programming-model.md, 10.2), as skein-shell is, with the
# subset's checks that matter in a main: no silent casts, overflow or
# panicking indexing. clippy.toml bans the std handles that close on drop.
[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
let_underscore_drop = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
unwrap_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
dbg_macro = "deny"
missing_assert_message = "deny"
iter_over_hash_type = "deny"

# The shipped executable, driven from tests/echo beside the other tiers.
[[test]]
name = "end_to_end"
path = "../../../tests/echo/tests/end_to_end.rs"

[dev-dependencies]
skein-world.workspace = true
skein-echo-client.workspace = true
skein-echo-world = { path = "../../../tests/echo" }
