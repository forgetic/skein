[package]
name = "skein-shell"
description = "The io_uring adapter for io's kernel records, the clock and the seed: what a service's main runs on"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
skein-lib.workspace = true
skein-io.workspace = true
io-uring.workspace = true
libc.workspace = true

# Ordinary Rust (programming-model.md, 10.2), with the lints that keep the one
# module allowed `unsafe` small and documented (9.4), and the subset's checks
# that matter next to the syscalls: no silent casts, overflow or panicking
# indexing.
[lints.rust]
unsafe_code = "deny"                  # allowed in the ring adapter module only
unsafe_op_in_unsafe_fn = "deny"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
let_underscore_drop = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
wildcard_enum_match_arm = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
unwrap_used = "deny"
let_underscore_must_use = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
dbg_macro = "deny"
missing_assert_message = "deny"
iter_over_hash_type = "deny"
