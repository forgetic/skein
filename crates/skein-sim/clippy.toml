# The simulator is ordinary Rust (programming-style.md, 9.2, last part): std,
# Vec, String, closures and formatting are in, since none of it runs in a
# service. What stays out is what would break replay or the lifecycle: a
# clock, threads, OS randomness, hash maps with a random seed, and std handles
# that close on drop.

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

disallowed-types = [
    { path = "std::time::Instant", reason = "the simulator owns time: Sim::now" },
    { path = "std::time::SystemTime", reason = "the simulator owns time: Sim::wall" },
    { path = "std::hash::RandomState", reason = "iteration order would depend on a random seed: BTreeMap" },
    { path = "std::sync::Arc", reason = "one thread, one owner" },
    { path = "std::sync::Mutex", reason = "one thread" },
    { path = "std::sync::RwLock", reason = "one thread" },
    { path = "std::fs::File", reason = "closes on drop (programming-style.md, 9.2)" },
    { path = "std::net::TcpStream", reason = "the simulator plays the network" },
    { path = "std::net::TcpListener", reason = "the simulator plays the network" },
    { path = "std::net::UdpSocket", reason = "the simulator plays the network" },
    { path = "std::os::fd::OwnedFd", reason = "closes on drop (programming-style.md, 9.2)" },
    { path = "std::process::Child", reason = "std::process is not used (overview.md, 5.3)" },
]

disallowed-methods = [
    { path = "std::thread::spawn", reason = "one thread: the world is deterministic" },
    { path = "std::collections::HashMap::new", reason = "a random seed: BTreeMap, or a fixed hasher" },
    { path = "std::collections::HashMap::with_capacity", reason = "a random seed: BTreeMap, or a fixed hasher" },
    { path = "std::collections::HashSet::new", reason = "a random seed: BTreeSet, or a fixed hasher" },
    { path = "std::collections::HashSet::with_capacity", reason = "a random seed: BTreeSet, or a fixed hasher" },
    { path = "std::env::var", reason = "behaviour comes from the seed and the config" },
]
