    { path = "slice::split_at", reason = "split_at_checked" },
    { path = "slice::split_at_mut", reason = "split_at_mut_checked" },
    { path = "slice::copy_from_slice", reason = "panics on a length mismatch: a Writer, or lengths checked first" },
