    { path = "core::mem::take", reason = "the placeholder is the terminal state: mem::replace" },
    { path = "core::mem::forget", reason = "an entity ends when it is reclaimed, not never" },
    { path = "alloc::boxed::Box::leak", reason = "an entity ends when it is reclaimed, not never" },
]
