# What the step crates may not use: docs/foundation/programming-model.md, section 10.
#
# Applies to every crate below this directory that has no clippy.toml of its
# own. skein-lib is held to it too; where lib builds a container on a type that
# is out (Vec, VecDeque, PhantomData), the module says so with a scoped
# #[expect(clippy::disallowed_types, reason = "...")]. Ordinary Rust (the
# simulators and test harnesses) has its own clippy.toml.
#
# panic! is out through the clippy::panic lint rather than here, and
# format_args! is not listed: unreachable!("why") and assertion messages expand
# to both, and those stay in.
#
# Some of the subset cannot be checked by clippy and stays a review rule:
# `loop`, `while` and recursion; closures stored in locals; defining traits and
# generic items; trait impls by hand (Drop, Deref, operators); `if let` on own
# enums and tuple scrutinees; macro_rules!.

# Unit tests run with std and may assert by panicking.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

disallowed-types = [
    # Growth without a check.
    { path = "alloc::vec::Vec", reason = "Box<[T]> for owned sequences, skein_lib::List or Queue for bounded ones" },
    { path = "alloc::collections::VecDeque", reason = "skein_lib::Queue" },
    { path = "alloc::collections::BinaryHeap", reason = "skein_lib::Deadlines, or a BTreeMap" },
    { path = "alloc::collections::LinkedList", reason = "skein_lib::List" },
    { path = "alloc::string::String", reason = "text is UTF-8 in a Box<[u8]>, checked by the protocol layer" },
    { path = "alloc::borrow::Cow", reason = "one owner: borrow or move, never maybe-clone" },
    # Shared ownership, interior mutability, global state.
    { path = "alloc::rc::Rc", reason = "one owner; everyone else holds an Id<T>" },
    { path = "alloc::rc::Weak", reason = "one owner; everyone else holds an Id<T>" },
    { path = "alloc::sync::Arc", reason = "one owner; everyone else holds an Id<T>" },
    { path = "alloc::sync::Weak", reason = "one owner; everyone else holds an Id<T>" },
    { path = "core::cell::Cell", reason = "no interior mutability" },
    { path = "core::cell::RefCell", reason = "no interior mutability" },
    { path = "core::cell::UnsafeCell", reason = "no interior mutability" },
    { path = "core::cell::OnceCell", reason = "no interior mutability" },
    { path = "core::cell::LazyCell", reason = "no interior mutability" },
    { path = "core::sync::atomic::AtomicBool", reason = "no global state" },
    { path = "core::sync::atomic::AtomicI8", reason = "no global state" },
    { path = "core::sync::atomic::AtomicI16", reason = "no global state" },
    { path = "core::sync::atomic::AtomicI32", reason = "no global state" },
    { path = "core::sync::atomic::AtomicI64", reason = "no global state" },
    { path = "core::sync::atomic::AtomicIsize", reason = "no global state" },
    { path = "core::sync::atomic::AtomicU8", reason = "no global state" },
    { path = "core::sync::atomic::AtomicU16", reason = "no global state" },
    { path = "core::sync::atomic::AtomicU32", reason = "no global state" },
    { path = "core::sync::atomic::AtomicU64", reason = "no global state" },
    { path = "core::sync::atomic::AtomicUsize", reason = "no global state" },
    { path = "core::sync::atomic::AtomicPtr", reason = "no global state" },
    # Leaks, pointers and pinning: none of it is needed outside the ring adapter.
    { path = "core::mem::ManuallyDrop", reason = "an entity ends when it is reclaimed, not never" },
    { path = "core::mem::MaybeUninit", reason = "no uninitialised state" },
    { path = "core::ptr::NonNull", reason = "handles, not pointers" },
    { path = "core::pin::Pin", reason = "no self-referential state" },
    # async: the loop schedules. Banning Future also catches `async fn`.
    { path = "core::future::Future", reason = "an enum state machine driven by the loop" },
    { path = "core::task::Poll", reason = "an enum state machine driven by the loop" },
    { path = "core::task::Context", reason = "an enum state machine driven by the loop" },
    { path = "core::task::Waker", reason = "an enum state machine driven by the loop" },
    # Closures, function pointers and dynamic types, as parameters and bounds.
    { path = "core::ops::Fn", reason = "events in, requests out: no callbacks" },
    { path = "core::ops::FnMut", reason = "events in, requests out: no callbacks" },
    { path = "core::ops::FnOnce", reason = "events in, requests out: no callbacks" },
    { path = "core::any::Any", reason = "concrete types only" },
    { path = "core::marker::PhantomData", reason = "only skein_lib::Id needs it" },
    # Floats: no total order, and nothing in this domain needs them.
    { path = "f32", reason = "integers, with a stated unit" },
    { path = "f64", reason = "integers, with a stated unit" },
    # Formatting. (Not fmt::Arguments: assertion messages are made of it.)
    { path = "core::fmt::Write", reason = "no formatting in step code; diagnostics are enum values" },
    # Time and hashing that the step does not control (reachable in unit tests, which have std).
    { path = "core::time::Duration", reason = "skein_lib::Duration" },
    { path = "std::time::Instant", reason = "env.now, a skein_lib::Time" },
    { path = "std::time::SystemTime", reason = "env.now, a skein_lib::Time" },
    { path = "std::collections::HashMap", reason = "iteration order depends on a random seed: BTreeMap" },
    { path = "std::collections::HashSet", reason = "iteration order depends on a random seed: BTreeSet" },
]

disallowed-macros = [
    { path = "alloc::format", reason = "no formatting in step code" },
    { path = "alloc::vec", reason = "no Vec in step code" },
    { path = "core::matches", reason = "a catch-all match in disguise" },
    { path = "core::write", reason = "no formatting in step code" },
    { path = "core::writeln", reason = "no formatting in step code" },
    { path = "core::debug_assert", reason = "assertions stay on in production: assert!" },
    { path = "core::debug_assert_eq", reason = "assertions stay on in production: assert!" },
    { path = "core::debug_assert_ne", reason = "assertions stay on in production: assert!" },
    { path = "core::default::Default", reason = "only the derives of programming-model.md, 10.2; a default can be a live state" },
    { path = "core::include", reason = "code the reader cannot see" },
    { path = "core::include_str", reason = "data comes in events and limits" },
    { path = "core::include_bytes", reason = "data comes in events and limits" },
    { path = "core::env", reason = "behaviour does not depend on the build environment" },
    { path = "core::option_env", reason = "behaviour does not depend on the build environment" },
    { path = "std::thread_local", reason = "no global state" },
    { path = "std::dbg", reason = "diagnostics are enum values" },
    { path = "std::print", reason = "diagnostics are enum values" },
    { path = "std::println", reason = "diagnostics are enum values" },
    { path = "std::eprint", reason = "diagnostics are enum values" },
    { path = "std::eprintln", reason = "diagnostics are enum values" },
]

